<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07040b">
<title>Game Store Neon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Chakra+Petch:wght@600;700&family=Plus+Jakarta+Sans:wght@400;600;800&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
/* Layout: tela inicial de jogo (computador). Cena de fundo que troca e repinta o site; card de destaque neon à esquerda; ondas no ritmo da música; barra de modos embaixo de onde os cards saem flutuando */
@property --a1{syntax:'<color>';inherits:true;initial-value:#ff3ea5}
@property --a2{syntax:'<color>';inherits:true;initial-value:#8b5cf6}
@property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}
:root{
  --a1:#ff3ea5; --a2:#8b5cf6; --gold:#ffe36e; --cyan:#5ef2ff;
  --bg:#07040b; --ink:#f7f1ff; --muted:#c2b6d8; --glass:rgba(12,6,22,.72); --line:rgba(247,241,255,.14);
  --f-display:Anton,Impact,'Arial Narrow',sans-serif;
  --f-body:'Plus Jakarta Sans',system-ui,sans-serif;
  --f-pixel:'Press Start 2P',ui-monospace,monospace;
  --dockh:112px;
  color-scheme:dark;
  transition:--a1 1.4s ease,--a2 1.4s ease;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.px{font-family:var(--f-pixel);font-size:9px;letter-spacing:.08em;text-transform:uppercase;line-height:1.6}
#app{position:fixed;inset:0;overflow:hidden;user-select:none;-webkit-user-select:none}

/* cenas */
.scene{position:absolute;inset:0;opacity:0;transition:opacity 1.4s ease}
.scene.on{opacity:1}
.scene video,.scene img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scene img{animation:kb 26s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1.04)}to{transform:scale(1.14) translate(-1.5%,-1%)}}
.shade{position:absolute;inset:0;pointer-events:none;background:
  linear-gradient(90deg,rgba(7,4,11,.7),rgba(7,4,11,.15) 40%,rgba(7,4,11,0) 60%),
  linear-gradient(0deg,rgba(7,4,11,.92) 0,rgba(7,4,11,.4) 26%,rgba(7,4,11,0) 45%),
  linear-gradient(180deg,rgba(7,4,11,.55),rgba(7,4,11,0) 20%)}
.tint{position:absolute;inset:0;pointer-events:none;mix-blend-mode:soft-light;background:radial-gradient(70% 60% at 80% 100%,var(--a1),transparent 70%),radial-gradient(50% 50% at 0% 0%,var(--a2),transparent 70%);opacity:.5}

/* topo */
.top{position:absolute;left:0;right:0;top:0;padding:calc(18px + env(safe-area-inset-top,0px)) 28px 0;display:flex;justify-content:space-between;align-items:flex-start;z-index:6}
.logo b{display:block;font-family:var(--f-display);font-weight:400;font-size:44px;line-height:.9;letter-spacing:.02em;text-shadow:0 2px 20px rgba(0,0,0,.5)}
.logo b span{color:var(--gold)}
.logo small{color:var(--muted);font-size:11px}
.tools{display:flex;gap:10px;align-items:center}
.ib{position:relative;width:46px;height:46px;border-radius:13px;display:grid;place-items:center;background:rgba(10,6,18,.6);border:1px solid var(--line);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.ib svg{width:21px;height:21px}
.ib em{position:absolute;top:-6px;right:-6px;font-style:normal;background:var(--a1);font-size:10px;font-weight:800;min-width:19px;height:19px;border-radius:10px;display:grid;place-items:center;color:#fff}
.ib.wa{background:#25d366;color:#06240f;border:0}
.radio{display:flex;align-items:center;gap:10px;height:46px;padding:0 16px 0 8px;border-radius:13px;border:1px solid var(--line);background:rgba(10,6,18,.6);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-weight:800;font-size:13px}
.radio .pp{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--a1);box-shadow:0 0 16px var(--a1)}
.radio .pp svg{width:13px;height:13px}
.radio small{display:block;font-weight:600;color:var(--muted);font-size:11px}
.eq{display:flex;gap:2px;align-items:flex-end;height:18px}
.eq i{width:3px;height:3px;border-radius:1px;background:var(--gold);transition:height .08s}

/* card de destaque */
.feat{position:absolute;left:28px;top:150px;width:min(420px,34vw);z-index:5;filter:drop-shadow(0 0 10px var(--a1)) drop-shadow(0 0 26px color-mix(in srgb,var(--a2) 70%,transparent));cursor:pointer}
.feat .frame{position:relative;padding:3px;clip-path:polygon(7% 0,100% 0,84% 100%,6% 100%,0 92%,0 9%);background:conic-gradient(from var(--ang),var(--a1),var(--a2),#ff8a3d,var(--a1));animation:spin 6s linear infinite}
@keyframes spin{to{--ang:360deg}}
.feat .in{clip-path:polygon(7% 0,100% 0,84% 100%,6% 100%,0 92%,0 9%);background:linear-gradient(160deg,rgba(26,8,36,.94),rgba(9,4,16,.96));padding:26px 22% 26px 30px;min-height:290px;display:grid;align-content:center;gap:10px;position:relative;overflow:hidden}
.feat .in::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px);pointer-events:none}
.tag{justify-self:start;font-family:var(--f-body);font-weight:800;font-size:12px;letter-spacing:.12em;text-transform:uppercase;border:1.5px solid var(--a1);color:#fff;padding:3px 10px;border-radius:7px;box-shadow:0 0 10px color-mix(in srgb,var(--a1) 60%,transparent)}
.feat h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(56px,6.4vw,92px);line-height:.88;color:var(--gold);text-shadow:0 0 18px color-mix(in srgb,var(--gold) 55%,transparent);text-transform:uppercase}
.feat h3{margin:0;font-weight:800;font-size:17px;letter-spacing:.06em;text-transform:uppercase;color:color-mix(in srgb,var(--a1) 55%,#fff)}
.feat p{margin:0;color:color-mix(in srgb,var(--a1) 35%,#fff);font-size:15px}
.cta{justify-self:start;margin-top:8px;border:0;border-radius:999px;padding:13px 30px;font-weight:800;font-size:16px;background:linear-gradient(180deg,#fff3a6,var(--gold));color:#1b0f02;box-shadow:0 0 18px color-mix(in srgb,var(--gold) 70%,transparent),inset 0 -3px 0 rgba(0,0,0,.15)}
.slide{display:grid;gap:10px}
.feat .bgimg{position:absolute;inset:0;background-size:cover;background-position:70% 30%;opacity:.5;-webkit-mask-image:linear-gradient(90deg,transparent 30%,#000 80%);mask-image:linear-gradient(90deg,transparent 30%,#000 80%);transition:opacity .5s;pointer-events:none}
.feat .slide{position:relative;z-index:1}
.feat h2.long{font-size:clamp(40px,4.4vw,64px)}
.slide.enter{animation:glitch .5s steps(1) both}
@keyframes glitch{0%{clip-path:inset(0 0 70% 0);transform:translateX(-8px)}15%{clip-path:inset(40% 0 20% 0);transform:translateX(8px)}30%{clip-path:inset(10% 0 55% 0);transform:translateX(-4px)}45%{clip-path:inset(60% 0 0 0);transform:translateX(5px)}60%,100%{clip-path:inset(0);transform:none}}
.fdots{display:flex;gap:6px;margin:12px 0 0 34px}
.fdots i{width:8px;height:8px;border-radius:4px;background:rgba(255,255,255,.25);transition:width .3s,background .3s}
.fdots i.on{width:24px;background:var(--gold)}
.fhint{color:var(--muted);margin:8px 0 0 34px}

/* ondas */
#waves{position:absolute;left:0;right:0;bottom:calc(var(--dockh) + 4px);height:120px;width:100%;pointer-events:none;z-index:3}

/* cenas: seletor */
.scenes{position:absolute;right:28px;bottom:calc(var(--dockh) + 22px);z-index:5;display:flex;gap:8px;align-items:center}
.scenes button{width:44px;height:28px;border-radius:8px;border:1.5px solid var(--line);background-size:cover;background-position:center;opacity:.7;transition:opacity .2s,border-color .2s,transform .2s}
.scenes button.on{opacity:1;border-color:var(--gold);transform:translateY(-2px)}
.scenes span{color:var(--muted);margin-right:4px}

/* barra de modos */
.dock{position:absolute;left:0;right:0;bottom:0;height:var(--dockh);padding:12px 22px calc(14px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(8,1fr);gap:12px;z-index:7;background:linear-gradient(0deg,rgba(7,4,11,.94),rgba(7,4,11,.6) 55%,transparent)}
.tile{--c:var(--a2);--ex:color-mix(in srgb,var(--c) 42%,#000);position:relative;border:0;background:none;padding:4px 2px;display:grid;justify-items:center;align-content:center;-webkit-tap-highlight-color:transparent;
  transform:perspective(500px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .2s ease-out}
.tile:focus-visible{outline:none}
.tile .fx{position:relative;display:grid;justify-items:center;animation:fl var(--fd,3.8s) ease-in-out infinite;animation-delay:var(--fdl,0s)}
@keyframes fl{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-6px) rotate(-1.4deg)}65%{transform:translateY(-2px) rotate(1.1deg)}}
.tile .cap{display:grid;justify-items:center;gap:6px;transition:transform .14s cubic-bezier(.3,1.6,.5,1)}
.tile svg{width:28px;height:28px;color:color-mix(in srgb,var(--c) 55%,#fff);filter:drop-shadow(0 0 6px var(--c)) drop-shadow(0 2px 0 var(--ex));transition:scale .25s cubic-bezier(.34,1.56,.64,1)}
.tile .lb{font-family:'Chakra Petch',var(--f-body);font-weight:700;font-size:19px;line-height:1;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;color:color-mix(in srgb,var(--c) 28%,#fff);
  text-shadow:0 0 10px color-mix(in srgb,var(--c) 75%,transparent),0 1px 0 var(--ex),0 2px 0 var(--ex),0 3px 0 var(--ex),0 4px 0 var(--ex),0 7px 12px rgba(0,0,0,.65);transition:text-shadow .14s,color .2s}
.tile .lb i{font-style:normal;display:inline-block}
.tile .bar{width:0;height:3px;border-radius:2px;background:var(--c);box-shadow:0 0 10px var(--c);transition:width .35s cubic-bezier(.2,.9,.2,1)}
.tile.cur .bar{width:64%}
.tile.gold{--c:var(--gold)}
.tile.cy{--c:var(--cyan)}
.tile.pk{--c:var(--a1)}
.tile.hot svg,.tile:focus-visible svg{scale:1.18}
.tile.hot .lb,.tile:focus-visible .lb,.tile.cur .lb{color:#fff;text-shadow:0 0 14px var(--c),0 0 30px color-mix(in srgb,var(--c) 60%,transparent),0 1px 0 var(--ex),0 2px 0 var(--ex),0 3px 0 var(--ex),0 4px 0 var(--ex),0 7px 12px rgba(0,0,0,.65)}
.tile.hot .lb i{animation:lw .5s cubic-bezier(.3,1.6,.5,1) backwards;animation-delay:calc(var(--i) * 35ms)}
@keyframes lw{40%{transform:translateY(-8px) scale(1.14)}}
.tile.press .cap{transform:translateY(4px) scale(.95)}
.tile.press .lb{text-shadow:0 0 22px var(--c),0 0 44px var(--c),0 1px 0 var(--ex),0 2px 6px rgba(0,0,0,.6)}
.tile.press svg{filter:drop-shadow(0 0 14px var(--c))}
.tile.sw .cap{transform:translateY(-7px)}
.tile.sw .lb{text-shadow:0 0 18px var(--c),0 0 36px var(--c),0 1px 0 var(--ex),0 2px 0 var(--ex),0 3px 0 var(--ex),0 4px 0 var(--ex)}
.tile.hot.k-home svg{animation:hop .55s}
.tile.hot.k-jogos svg{animation:spy .7s cubic-bezier(.3,.7,.3,1)}
.tile.hot.k-cons svg,.tile.hot.k-ct svg{animation:wig .6s}
.tile.hot.k-aces svg{animation:hop .55s}
.tile.hot.k-setup svg,.tile.hot.k-era svg{animation:stat .6s steps(1)}
.tile.hot.k-gta svg{animation:drop .7s}
@keyframes hop{30%{translate:0 -8px}60%{translate:0 0}78%{translate:0 -3px}}
@keyframes wig{20%{rotate:-14deg}40%{rotate:11deg}60%{rotate:-6deg}80%{rotate:3deg}}
@keyframes drop{0%{translate:0 -12px}40%{translate:0 0}55%{translate:0 -6px}70%,100%{translate:0 0}}
@keyframes spy{to{rotate:y 360deg}}
@keyframes stat{0%{opacity:.2;translate:2px 0}15%{opacity:1;translate:-2px 0}30%{opacity:.4}45%{opacity:1;translate:1px 0}60%,100%{opacity:1;translate:0 0}}
.tile .new{position:absolute;top:-12px;left:calc(50% + 14px);z-index:2;font-family:'Chakra Petch',var(--f-body);font-style:normal;font-size:10px;font-weight:700;letter-spacing:.08em;color:#fff;background:var(--a1);padding:3px 8px;border-radius:999px;box-shadow:0 0 12px var(--a1);rotate:-8deg;animation:nb 1.6s ease-in-out infinite}
@keyframes nb{50%{transform:translateY(-3px) scale(1.06)}}
.tile.flick .lb{animation:tube .6s steps(1)}
.shock{position:absolute;left:var(--x);top:var(--y);width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;border:2px solid var(--c);pointer-events:none;z-index:3;animation:shock .55s ease-out forwards}
@keyframes shock{to{transform:scale(7);opacity:0}}
.spark{position:absolute;left:var(--x);top:var(--y);width:4px;height:4px;border-radius:2px;background:var(--c);box-shadow:0 0 6px var(--c);pointer-events:none;z-index:3;animation:spark .6s ease-out forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0}}

@keyframes blink{50%{opacity:.35}}
@keyframes tube{0%{opacity:.2}12%{opacity:1}22%{opacity:.3}34%{opacity:1}48%{opacity:.5}60%,100%{opacity:1}}
/* card que sai da barra */
#pop{position:absolute;z-index:9;left:0;top:0;width:360px;height:440px;display:none;will-change:transform}
#pop.show{display:block}
#pop .bob{position:absolute;inset:0;animation:bob 3.4s ease-in-out infinite}
#pop.full .bob,#pop.drag .bob{animation:none}
@keyframes bob{50%{transform:translateY(-6px) rotate(-.4deg)}}
#pop .card{position:absolute;inset:0;border-radius:18px;padding:2px;background:linear-gradient(160deg,var(--c,var(--a1)),transparent 40%,transparent 60%,var(--a2));box-shadow:0 0 24px color-mix(in srgb,var(--c,var(--a1)) 60%,transparent),0 30px 60px rgba(0,0,0,.55)}
#pop .inner{height:100%;border-radius:16px;background:rgba(14,7,26,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:flex;flex-direction:column;overflow:hidden}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px 10px;cursor:grab;touch-action:none}
.ph:active{cursor:grabbing}
.ph h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:32px;letter-spacing:.02em;color:var(--gold);text-shadow:0 0 14px color-mix(in srgb,var(--gold) 50%,transparent);text-transform:uppercase}
.ph .grip{color:var(--muted)}
.pacts{display:flex;gap:8px}
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.06);padding:9px 14px;font-weight:800;font-size:12.5px;white-space:nowrap}
.btn.gold{background:var(--gold);color:#1b0f02;border-color:transparent}
.pb{flex:1;overflow:auto;padding:4px 18px 18px;overscroll-behavior:contain;user-select:text;-webkit-user-select:text}
.lead{color:var(--muted);font-size:14px;line-height:1.5;margin:0 0 14px;max-width:60ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.it{border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.04);overflow:hidden;display:flex;flex-direction:column}
.it .art{aspect-ratio:4/3;display:grid;place-items:center;background:radial-gradient(70% 70% at 50% 40%,color-mix(in srgb,var(--c,var(--a1)) 45%,transparent),transparent 70%),linear-gradient(160deg,#1d1030,#0c0616)}
.it .art svg{width:46%;height:auto;color:#fff;filter:drop-shadow(0 0 10px var(--c,var(--a1)))}
.it .t{padding:9px 10px;display:grid;gap:6px}
.it b{font-size:13.5px}
.it small{color:var(--muted);font-size:11.5px}
.it .btn{justify-self:start;padding:7px 11px;font-size:11.5px}
#pop.full .grid{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.it .art img{width:100%;height:100%;object-fit:cover;display:block}
.it .art.ph{background:#0c0616}
.it .pr{font-family:var(--f-display);font-size:19px;letter-spacing:.02em;color:var(--gold)}
.it .acts{display:flex;gap:6px;flex-wrap:wrap}
.more{margin-top:12px;width:100%;justify-content:center;border-color:color-mix(in srgb,var(--c,var(--a1)) 60%,transparent)}
.dragtip{color:var(--muted);text-align:center;padding:0 0 10px}
#pop.full .dragtip{display:none}
@media (max-width:899px){.dragtip .dt2{display:none}}

/* site atual aberto dentro do painel */
.pf{flex:1;position:relative;min-height:0;margin:0 10px 10px;border-radius:12px;overflow:hidden;background:#09080f}
.pf iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#09080f}
.pfl{position:absolute;inset:0;display:grid;place-items:center;background:#09080f;transition:opacity .35s}
.pfl.off{opacity:0;pointer-events:none}
.pfl .bar{width:160px;height:4px;border-radius:2px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:10px}
.pfl .bar i{display:block;height:100%;width:40%;background:linear-gradient(90deg,var(--a1),var(--gold));animation:ld 1s ease-in-out infinite}
@keyframes ld{from{transform:translateX(-100%)}to{transform:translateX(260%)}}
#pop.site .pb,#pop.site .dragtip,#pop.site .grip,#pop.full #popOpen{display:none}
#pop.site .ph{padding:12px 16px 10px;cursor:default}
#pop.full .bob .card{border-radius:20px}
@media (max-width:899px){
  #app.site-open .dock,#app.site-open #waves,#app.site-open .scenes{transform:translateY(120%);opacity:0;pointer-events:none}
  .dock,#waves,.scenes{transition:transform .4s cubic-bezier(.2,.9,.2,1),opacity .3s}
  #pop.full .bob .card{border-radius:18px 18px 0 0}
  #pop.site .pf{margin:0}
}
#toast{position:absolute;left:50%;top:22px;transform:translate(-50%,-20px);z-index:30;background:#1c1033;border:1px solid var(--line);padding:12px 16px;border-radius:12px;font-size:13.5px;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;max-width:calc(100vw - 32px)}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- celular ---------- */
@media (max-width:899px){
  :root{--dockh:178px}
  .top{padding:calc(12px + env(safe-area-inset-top,0px)) 16px 0}
  .logo b{font-size:28px}
  .radio{height:42px;padding:0 6px}.radio .t,.radio .eq{display:none}
  .ib{width:42px;height:42px}
  .feat{left:16px;right:16px;top:86px;width:auto}
  .feat .in{min-height:0;padding:18px 26% 18px 22px;gap:6px}
  .feat h2{font-size:58px}
  .feat h3{font-size:14px}.feat p{font-size:13px}
  .cta{padding:10px 22px;font-size:14px}
  .fdots,.fhint{margin-left:24px}
  .fhint{display:none}
  .dock{grid-template-columns:repeat(4,1fr);gap:8px;padding:10px 14px calc(12px + env(safe-area-inset-bottom,0px))}
  .tile svg{width:22px;height:22px}
  .tile .lb{font-size:12px;letter-spacing:.02em;text-align:center;white-space:normal}
  .tile .new{font-size:8.5px;top:-10px;left:calc(50% + 6px)}
  .scenes{right:16px}
  .scenes span{display:none}
  #waves{height:90px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<div id="app">
  <div class="scene on" data-s="0"><video id="vid" muted playsinline loop autoplay preload="auto" poster="media/hero-poster.jpg"><source src="media/hero.mp4" type="video/mp4"><source src="media/hero.webm" type="video/webm"></video></div>
  <div class="scene" data-s="1"><img src="media/miami.jpg" alt=""></div>
  <div class="scene" data-s="2"><img src="media/cidade.jpg" alt=""></div>
  <div class="tint"></div><div class="shade"></div>
  <canvas id="waves" aria-hidden="true"></canvas>

  <header class="top">
    <div class="logo"><b>GAME <span>STORE</span></b><small class="px">Limeira · SP</small></div>
    <div class="tools">
      <button class="radio" id="radio" aria-pressed="false"><span class="pp" id="pp"></span><span class="t">Rádio da loja<small id="rt">Neon Drift · toque pra ouvir</small></span><span class="eq" id="eq"><i></i><i></i><i></i><i></i><i></i></span></button>

      <button class="ib" id="cartBtn" aria-label="Carrinho"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.4 11h11L21 8H6.2"/><circle cx="9" cy="20" r="1.3"/><circle cx="18" cy="20" r="1.3"/></svg><em id="cartN" hidden>0</em></button>

<script>
(()=>{
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches,MOB=()=>innerWidth<900;
const root=document.documentElement,app=$('#app');
/* ===== CONFIGURAÇÃO (é só editar aqui) ===== */
const CFG={
  site:'../index.html',                       // site atual (abre dentro do painel)
  wa:'https://wa.me/55XXXXXXXXXXX',           // WhatsApp (troque pelo número real)
  waMsg:'Olá! Vim pelo site da Game Store.',
  rota:{jogos:'jogos',cons:'consoles',aces:'acess',setup:'acess',era:'era',gta:'gta'},  // modo → aba do site atual
  esconder:'.hd,.bnav,.foot,#tabs,#menu{display:none!important}',  // partes do site atual escondidas dentro do painel
  pele:'embed.css'                     // estilo escuro aplicado no site atual só quando ele abre aqui dentro
};
const I={
 home:'<path d="M3 11 12 4l9 7v9h-6v-6H9v6H3Z"/>',
 jogos:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 5v14M17 5v14M3 10h4M17 10h4M3 14h4M17 14h4"/>',
 cons:'<path d="M6 8h12a4 4 0 0 1 4 4v1a4 4 0 0 1-7 2.6L14 15h-4l-1 .6A4 4 0 0 1 2 13v-1a4 4 0 0 1 4-4Z"/><path d="M7 11v3M5.5 12.5h3M16 11h.01M18 13h.01"/>',
 aces:'<path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="2.5" y="14" width="5" height="7" rx="2"/><rect x="16.5" y="14" width="5" height="7" rx="2"/>',
 setup:'<rect x="2" y="4" width="20" height="12" rx="1.5"/><path d="M8 20h8M12 16v4"/>',
 era:'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="m8 3 4 4 4-4M17 11v.01M17 14v.01"/>',
 gta:'<path d="M12 21c-4-3-7-6-7-10a7 7 0 0 1 14 0c0 4-3 7-7 10Z"/><circle cx="12" cy="10" r="2.5"/>',
 ct:'<path d="M4 5h16v11H9l-5 4Z"/><path d="M8.5 10.5h.01M12 10.5h.01M15.5 10.5h.01"/>',
 mouse:'<rect x="7" y="3" width="10" height="18" rx="5"/><path d="M12 7v3"/>',
 kb:'<rect x="2" y="7" width="20" height="10" rx="2"/><path d="M6 11h.01M10 11h.01M14 11h.01M18 11h.01M7 14h10"/>',
 cabo:'<path d="M7 3v5M12 3v5M5 8h9v3a4.5 4.5 0 0 1-9 0Z"/><path d="M9.5 15.5V21"/>',
 tv:'<rect x="2" y="5" width="20" height="13" rx="2"/><path d="M8 21h8"/>',
 pin:'<path d="M12 21s-7-6-7-11a7 7 0 0 1 14 0c0 5-7 11-7 11Z"/><circle cx="12" cy="10" r="2.5"/>',
 clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'
};
const sv=k=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${I[k]}</svg>`;

/* ---------- cenas + cor automática tirada da imagem ---------- */
const SC=[{src:'media/hero-poster.jpg',name:'Sakura'},{src:'media/miami.jpg',name:'Miami'},{src:'media/cidade.jpg',name:'Cidade'}];
const scenes=$$('.scene'),vid=$('#vid');let si=0,stimer;
function palette(img){
  const c=document.createElement('canvas'),w=c.width=64,h=c.height=36,x=c.getContext('2d');x.drawImage(img,0,0,w,h);
  const d=x.getImageData(0,0,w,h).data,bins=new Array(36).fill(0);
  for(let i=0;i<d.length;i+=4){const r=d[i]/255,g=d[i+1]/255,b=d[i+2]/255,mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,s=mx===mn?0:(mx-mn)/(1-Math.abs(2*l-1));
    if(s<.25||l<.12||l>.92)continue;let hh;if(mx===r)hh=((g-b)/(mx-mn))%6;else if(mx===g)hh=(b-r)/(mx-mn)+2;else hh=(r-g)/(mx-mn)+4;hh=(hh*60+360)%360;
    bins[Math.floor(hh/10)%36]+=s*s*mx*mx}
  const sm=bins.map((v,i)=>v+.5*(bins[(i+35)%36]+bins[(i+1)%36]));
  let h1=sm.indexOf(Math.max(...sm));let best=-1,h2=(h1+12)%36;
  sm.forEach((v,i)=>{const dd=Math.min(Math.abs(i-h1),36-Math.abs(i-h1));const sc=v*Math.pow(dd,1.5);if(dd>=5&&sc>best){best=sc;h2=i}});
  return[`hsl(${h1*10+5} 95% 62%)`,`hsl(${h2*10+5} 90% 64%)`];
}
SC.forEach((s,i)=>{const im=new Image();im.onload=()=>{s.pal=palette(im);if(i===si)applyPal(i)};im.src=s.src;
  const b=document.createElement('button');b.style.backgroundImage=`url(${s.src})`;b.setAttribute('aria-label','Cena '+s.name);b.onclick=()=>{setScene(i);restart()};$('#scenes').appendChild(b)});
function applyPal(i){const p=SC[i].pal;if(!p)return;root.style.setProperty('--a1',p[0]);root.style.setProperty('--a2',p[1])}
/* fundo em WebGL: a cena reage ao toque e ao mouse com ondas na imagem */
var GL=(()=>{
  if(RM)return null;
  const cv=document.createElement('canvas');cv.id='gl';cv.style.cssText='position:absolute;inset:0;width:100%;height:100%;display:block';
  $('.tint').before(cv);
  const gl=cv.getContext('webgl',{alpha:false,antialias:false});
  if(!gl){cv.remove();return null}
  const vs=`attribute vec2 p;varying vec2 v;void main(){v=vec2(p.x*.5+.5,.5-p.y*.5);gl_Position=vec4(p,0.,1.);}`;
  const fs=`precision highp float;varying vec2 v;uniform sampler2D A,B;uniform float mixv,now,aA,aB,asp;uniform vec4 R[10];uniform vec3 acc;
  vec2 cover(vec2 uv,float ta){vec2 s=asp>ta?vec2(1.,ta/asp):vec2(asp/ta,1.);return (uv-.5)*s+.5;}
  vec2 kb(vec2 uv,float k,float on){float z=1.+on*(.07+.035*sin(now*.06+k));return (uv-.5)/z+.5+on*vec2(sin(now*.031+k),cos(now*.027+k))*.012;}
  void main(){vec2 off=vec2(0.);float glow=0.;
    for(int i=0;i<10;i++){vec4 r=R[i];float age=now-r.z;if(r.w<=0.||age<0.||age>4.)continue;
      vec2 d=(v-r.xy)*vec2(asp,1.);float dist=length(d);float ring=exp(-pow((dist-age*.38)*7.,2.));
      float a=ring*exp(-age*1.1)*r.w;off+=(dist>.0001?d/dist:vec2(0.))*a*.016*sin(dist*46.-age*12.);glow+=a*(.5+.5*sin(dist*46.-age*12.));}
    off.x/=asp;
    vec2 ua=kb(cover(v,aA),0.,1.),ub=kb(cover(v,aB),2.,1.);
    vec3 ca=vec3(texture2D(A,ua+off*1.15).r,texture2D(A,ua+off).g,texture2D(A,ua+off*.85).b);
    vec3 cb=vec3(texture2D(B,ub+off*1.15).r,texture2D(B,ub+off).g,texture2D(B,ub+off*.85).b);
    vec3 c=mix(cb,ca,mixv)+acc*glow*.12;gl_FragColor=vec4(c,1.);}`;
  const sh=(t,src)=>{const o=gl.createShader(t);gl.shaderSource(o,src);gl.compileShader(o);return o};
  const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,vs));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(pr);
  if(!gl.getProgramParameter(pr,gl.LINK_STATUS)){cv.remove();return null}
  gl.useProgram(pr);
  const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
  const pl=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(pl);gl.vertexAttribPointer(pl,2,gl.FLOAT,false,0,0);
  const U=n=>gl.getUniformLocation(pr,n);gl.uniform1i(U('A'),0);gl.uniform1i(U('B'),1);
  const mk=()=>{const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);[gl.TEXTURE_WRAP_S,gl.TEXTURE_WRAP_T].forEach(w=>gl.texParameteri(gl.TEXTURE_2D,w,gl.CLAMP_TO_EDGE));[gl.TEXTURE_MIN_FILTER,gl.TEXTURE_MAG_FILTER].forEach(f=>gl.texParameteri(gl.TEXTURE_2D,f,gl.LINEAR));gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,1,1,0,gl.RGBA,gl.UNSIGNED_BYTE,new Uint8Array([7,4,11,255]));return t};
  const T=SC.map(()=>({t:mk(),a:16/9,ok:false}));
  const srcs=[vid,...$$('.scene img')];
  srcs.forEach((el,i)=>{if(i===0)return;const load=()=>{gl.bindTexture(gl.TEXTURE_2D,T[i].t);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGB,gl.RGB,gl.UNSIGNED_BYTE,el);T[i].a=el.naturalWidth/el.naturalHeight;T[i].ok=true};el.complete&&el.naturalWidth?load():el.addEventListener('load',load)});
  let cur=0,prev=0,fadeT=-9,acc=[1,.25,.6];const rips=new Float32Array(40);let ri=0;const t0=performance.now();
  const now=()=>(performance.now()-t0)/1000;
  function size(){const d=Math.min(1.5,devicePixelRatio||1);cv.width=Math.round(innerWidth*d);cv.height=Math.round(innerHeight*d)}
  size();addEventListener('resize',size);
  function readAcc(){const m=getComputedStyle(root).getPropertyValue('--a1').match(/[\d.]+/g);if(m)acc=m.slice(0,3).map(v=>v/255)}
  setInterval(readAcc,500);
  function frame(){
    requestAnimationFrame(frame);if(document.hidden)return;
    if((cur===0||prev===0)&&vid.readyState>=2){gl.bindTexture(gl.TEXTURE_2D,T[0].t);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGB,gl.RGB,gl.UNSIGNED_BYTE,vid);T[0].a=vid.videoWidth/vid.videoHeight;T[0].ok=true}
    gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,T[cur].t);gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,T[prev].t);
    const n=now(),k=Math.min(1,(n-fadeT)/1.4);
    gl.viewport(0,0,cv.width,cv.height);
    gl.uniform1f(U('mixv'),k*k*(3-2*k));gl.uniform1f(U('now'),n);gl.uniform1f(U('asp'),cv.width/cv.height);
    gl.uniform1f(U('aA'),T[cur].a);gl.uniform1f(U('aB'),T[prev].a);gl.uniform4fv(U('R'),rips);gl.uniform3fv(U('acc'),acc);
    gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  }
  requestAnimationFrame(frame);
  // ondas no fundo: rastro do mouse/dedo e toque forte
  let lx=-1,ly=-1,lt=0;
  function ripple(x,y,str){rips.set([x/innerWidth,y/innerHeight,now(),str],ri*4);ri=(ri+1)%10;Waves.kick(Math.min(.6,str*.3))}
  addEventListener('pointermove',e=>{const t=performance.now();if(t-lt<70)return;if(Math.hypot(e.clientX-lx,e.clientY-ly)<40)return;lt=t;lx=e.clientX;ly=e.clientY;ripple(lx,ly,.3)},{passive:true});
  $('#app').addEventListener('pointerdown',e=>{if(e.target.closest('.tile,#pop,button'))return;ripple(e.clientX,e.clientY,1.3)});
  return{ripple,set(i){if(i===cur)return;prev=cur;cur=i;fadeT=now()}};
})();
function setScene(i){si=i;GL&&GL.set(i);scenes.forEach((s,j)=>s.classList.toggle('on',j===i));$$('#scenes button').forEach((b,j)=>b.classList.toggle('on',j===i));applyPal(i);
  if(i===0){vid.play().catch(()=>{})}else setTimeout(()=>{if(si!==0)vid.pause()},1500)}
function restart(){clearInterval(stimer);if(!RM)stimer=setInterval(()=>setScene((si+1)%SC.length),16000)}
setScene(0);restart();vid.play().catch(()=>{});

/* ---------- dados reais (dados.json, gerado a partir do site atual) ---------- */
let DATA=null;const KEY={jogos:'jogos',cons:'consoles',aces:'acessorios',setup:'setup',era:'era',gta:'gta'};
const esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
fetch('dados.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(d=>{if(!d)return;DATA=d;
  if(Array.isArray(d.destaques)&&d.destaques.length){FEAT.splice(0,FEAT.length,...d.destaques,FEAT[FEAT.length-1]);fd.innerHTML=FEAT.map(()=>'<i></i>').join('');showFeat(0)}
  if(popI>=0&&pop.classList.contains('show')&&!pop.classList.contains('site'))pb.innerHTML=render(MODES[popI].id)}).catch(()=>{});
function render(id){
  const k=KEY[id],list=DATA&&k&&Array.isArray(DATA[k])?DATA[k]:null;
  if(!list||!list.length)return CONTENT[id]();
  const m=MODES.find(x=>x.id===id),lead=(DATA.textos&&DATA.textos[k])||'';
  return (lead?`<p class="lead">${esc(lead)}</p>`:'')+`<div class="grid">${list.slice(0,8).map(x=>`<div class="it"><div class="art${x.img?' ph':''}">${x.img?`<img src="${esc(x.img)}" alt="${esc(x.nome)}" loading="lazy">`:sv(m.k)}</div><div class="t"><b>${esc(x.nome)}</b>${x.sub?`<small>${esc(x.sub)}</small>`:''}${x.preco?`<span class="pr">${esc(x.preco)}</span>`:''}<div class="acts"><button class="btn gold" data-wa>${esc(x.botao||'Quero')}</button></div></div></div>`).join('')}</div>`+(CFG.rota[id]?`<button class="btn more" data-full>Ver tudo em ${esc(m.l)} →</button>`:'');
}

/* ---------- card de destaque ---------- */
const FEAT=[
 {tag:'Reserva',h:'GTA VI',s:'Reserva aberta',p:'Retire no dia 19.11',b:'Reservar',act:'mode:gta',img:'../media/gta/keyart.webp'},
 {tag:'Oferta da semana',h:'Combo Setup',s:'Monte o seu em 4 passos',p:'Console + controle + headset',b:'Montar agora',act:'mode:setup'},
 {tag:'Rádio da loja',h:'Neon Drift',s:'Trilha ao vivo',p:'A batida mexe as ondas do site',b:'Tocar',act:'radio'}
];
let fi=0;const slide=$('#slide'),fd=$('#fdots');fd.innerHTML=FEAT.map(()=>'<i></i>').join('');
function showFeat(i){fi=i;const f=FEAT[i];let bi=$('#feat .bgimg');if(!bi){bi=document.createElement('div');bi.className='bgimg';$('#feat .in').prepend(bi)}bi.style.backgroundImage=f.img?`url("${String(f.img).replace(/"/g,'')}")`:'none';slide.innerHTML=`<span class="tag">${esc(f.tag)}</span><h2${String(f.h).length>10?' class="long"':''}>${esc(f.h)}</h2><h3>${esc(f.s)}</h3><p>${esc(f.p)}</p><button class="cta" data-act="${esc(f.act)}">${esc(f.b)}</button>`;
  slide.classList.remove('enter');void slide.offsetWidth;slide.classList.add('enter');[...fd.children].forEach((d,j)=>d.classList.toggle('on',j===i))}
showFeat(0);
$('#feat').addEventListener('click',e=>{const b=e.target.closest('.cta');if(b){const a=b.dataset.act;if(a==='radio')Radio.toggle();else if(a.startsWith('mode:'))openModeFull(a.slice(5));else openWA();return}showFeat((fi+1)%FEAT.length);Waves.kick(.8)});

/* ---------- barra de modos ---------- */
const MODES=[
 {id:'inicio',l:'Início',k:'home'},{id:'jogos',l:'Jogos',k:'jogos',c:'pk'},{id:'cons',l:'Consoles',k:'cons',c:'gold',isNew:1},{id:'aces',l:'Acessórios',k:'aces'},
 {id:'setup',l:'Setup',k:'setup',c:'cy'},{id:'era',l:'Era dos Games',k:'era'},{id:'gta',l:'GTA VI',k:'gta',c:'pk',isNew:1},{id:'ct',l:'Contato',k:'ct',c:'pk'}];
const dock=$('#dock');
const MI=['#ffd36e','#ffa66e','#ff6aa8','#ff3ea5','#d35cff','#a86cff'];
const letters=(m)=>{let k=0;return m.l.split(' ').map(w=>'<span style="white-space:nowrap">'+[...w].map(ch=>{const j=k++;return `<i style="--i:${j}${m.id==='gta'?';color:'+MI[j%MI.length]:''}">${ch}</i>`}).join('')+'</span>').join(' ')};
dock.innerHTML=MODES.map((m,i)=>`<button class="tile k-${m.id} ${m.c||''}" data-i="${i}" style="--fd:${3.4+(i*.37)%1.4}s;--fdl:${-i*.55}s"><span class="fx"><span class="cap">${sv(m.k)}<span class="lb">${letters(m)}</span><span class="bar"></span></span>${m.isNew?'<em class="new">NOVO</em>':''}</span></button>`).join('');
const tiles=$$('.tile');
// neon que falha de vez em quando
if(!RM)setInterval(()=>{const t=tiles[Math.floor(Math.random()*tiles.length)];if(t.classList.contains('hot'))return;t.classList.remove('flick');void t.offsetWidth;t.classList.add('flick')},3600);
// modo arcade: onda de luz atravessando a barra (no ritmo da rádio quando ela toca)
function sweep(){tiles.forEach((t,i)=>setTimeout(()=>{if(t.classList.contains('hot'))return;t.classList.remove('sw');void t.offsetWidth;t.classList.add('sw');setTimeout(()=>t.classList.remove('sw'),420)},i*70))}
let swT=0;if(!RM)(function loopSweep(){const ms=(window.__radioOn?2400:6000);swT=setTimeout(()=>{sweep();loopSweep()},ms)})();
// inclinação 3D + reflexo seguindo o ponteiro, e impacto no clique
tiles.forEach(t=>{
  const tilt=e=>{const r=t.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
    t.style.setProperty('--ry',((x-.5)*22).toFixed(1)+'deg');t.style.setProperty('--rx',((.5-y)*18).toFixed(1)+'deg');t.style.setProperty('--gx',(x*100).toFixed(0)+'%');t.style.setProperty('--gy',(y*100).toFixed(0)+'%')};
  t.addEventListener('pointermove',e=>{if(!RM)tilt(e)});
  t.addEventListener('pointerleave',()=>{['--rx','--ry'].forEach(v=>t.style.setProperty(v,'0deg'))});
  const up=()=>t.classList.remove('press');t.addEventListener('pointerup',up);t.addEventListener('pointercancel',up);t.addEventListener('pointerleave',up);
  t.addEventListener('pointerdown',e=>{t.classList.add('press');if(navigator.vibrate){try{navigator.vibrate(10)}catch(_){}}if(RM)return;tilt(e);const r=t.getBoundingClientRect(),x=e.clientX-r.left+'px',y=e.clientY-r.top+'px';
    GL&&GL.ripple(e.clientX,e.clientY,1.6);
    for(let k=0;k<10;k++){const sp=document.createElement('span');sp.className='spark';const a=Math.random()*6.28,d=30+Math.random()*40;sp.style.cssText=`--x:${x};--y:${y};--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d}px`;t.appendChild(sp);setTimeout(()=>sp.remove(),650)}
    Waves.kick(.5)});
});

/* ---------- conteúdo dos modos ---------- */
const it=(k,n,s,b='Quero')=>`<div class="it"><div class="art">${sv(k)}</div><div class="t"><b>${n}</b><small>${s}</small><button class="btn gold" data-wa>${b}</button></div></div>`;
const CONTENT={

/* ---------- card que sai flutuando da barra ---------- */
const pop=$('#pop'),pb=$('#pb');let popI=-1,pinned=false,full=false,hideT=0,hoverT=0,rest=null;
function targetRect(i){
  const r=tiles[i].getBoundingClientRect(),W=MOB()?Math.min(innerWidth-24,380):360,H=MOB()?Math.min(innerHeight*.56,440):430;
  if(full){if(MOB()){const y=$('.top').getBoundingClientRect().bottom+8;return{x:0,y,w:innerWidth,h:innerHeight-y}}
    if(pop.classList.contains('site'))return{x:24,y:92,w:innerWidth-48,h:dock.getBoundingClientRect().top-104};
    const fr=$('#feat').getBoundingClientRect(),x=Math.max(fr.right+28,innerWidth*.36);return{x,y:96,w:innerWidth-x-28,h:dock.getBoundingClientRect().top-110}}
  let x=r.left+r.width/2-W/2;x=Math.max(12,Math.min(innerWidth-W-12,x));
  return{x,y:dock.getBoundingClientRect().top-H-18,w:W,h:H};
}
function place(t,anim){
  pop.style.width=t.w+'px';pop.style.height=t.h+'px';
  const to=`translate(${t.x}px,${t.y}px)`;rest=t;
  if(anim&&!RM){const r=tiles[popI].getBoundingClientRect();const from=`translate(${r.left}px,${r.top}px) scale(${r.width/t.w},${r.height/t.h})`;
    pop.animate([{transform:from,opacity:.2,transformOrigin:'0 0'},{transform:to,opacity:1,transformOrigin:'0 0'}],{duration:420,easing:'cubic-bezier(.2,.9,.2,1)'})}
  pop.style.transform=to;pop.style.transformOrigin='0 0';
}
function openPop(i,pin){
  clearTimeout(hideT);const changed=popI!==i;popI=i;const m=MODES[i];
  tiles.forEach((t,j)=>t.classList.toggle('cur',j===i));
  if(changed||!pop.classList.contains('show')){
    $('#popt').textContent=m.l;pb.innerHTML=render(m.id);pb.scrollTop=0;
    const col=getComputedStyle(tiles[i]).getPropertyValue('--c');pop.style.setProperty('--c',col||'var(--a1)');
    const was=pop.classList.contains('show');pop.classList.add('show');place(targetRect(i),!was);if(was)pop.animate([{opacity:.4},{opacity:1}],{duration:220});
    Waves.kick(.6);
  }
  if(pin)pinned=true;
}
function closePop(){
  if(!pop.classList.contains('show'))return;full=false;pinned=false;pop.classList.remove('full','site');pf.hidden=true;app.classList.remove('site-open');$('#popX').textContent='✕';
  const r=tiles[popI].getBoundingClientRect(),t=rest;
  const end=()=>{pop.classList.remove('show');tiles.forEach(t=>t.classList.remove('cur'))};
  if(RM||!t)return end();
  pop.animate([{transform:pop.style.transform,opacity:1},{transform:`translate(${r.left}px,${r.top}px) scale(${r.width/t.w},${r.height/t.h})`,opacity:0}],{duration:320,easing:'cubic-bezier(.6,0,.4,1)'});setTimeout(()=>{if(!full)end()},330);
}
const ifr=$('#ifr'),pf=$('#pf'),pfl=$('#pfl');
function siteURL(r){return new URL(CFG.site+'?embed=1',location.href).href+'#/'+r}
function openSite(r){
  pop.classList.add('site');pf.hidden=false;app.classList.add('site-open');
  if(!ifr.getAttribute('src')){pfl.classList.remove('off');ifr.src=siteURL(r);return}
  try{ifr.contentWindow.location.replace(siteURL(r))}catch(e){ifr.src=siteURL(r)}
}
ifr.addEventListener('load',()=>{
  try{const d=ifr.contentDocument;if(d&&!d.getElementById('neon-embed')){const st=d.createElement('style');st.id='neon-embed';st.textContent=CFG.esconder;d.head.appendChild(st);const ln=d.createElement('link');ln.rel='stylesheet';ln.href=new URL(CFG.pele,location.href).href+'?v='+Date.now().toString(36).slice(0,5);d.head.appendChild(ln);d.documentElement.classList.add('neon-embed')}}catch(e){}
  pfl.classList.add('off');
});
function syncMode(i){const r=CFG.rota[MODES[i].id];if(full&&r){openSite(r)}else{pop.classList.remove('site');pf.hidden=true;app.classList.remove('site-open');pb.innerHTML=render(MODES[i].id)}}
function openModeFull(id){const i=MODES.findIndex(m=>m.id===id);if(i<0)return;if(full){popI=i;$('#popt').textContent=MODES[i].l;tiles.forEach((x,j)=>x.classList.toggle('cur',j===i));syncMode(i);place(targetRect(i),false);return}openPop(i,true);goFull()}
function goFull(){if(popI<0)return;full=true;pinned=true;pop.classList.add('full');const r0=CFG.rota[MODES[popI].id];if(r0)pop.classList.add('site');$('#popX').textContent='◀ Menu';const t=targetRect(popI);
  const from=pop.style.transform,fw=pop.offsetWidth,fh=pop.offsetHeight;place(t,false);
  if(!RM)pop.animate([{transform:from+` scale(${fw/t.w},${fh/t.h})`},{transform:`translate(${t.x}px,${t.y}px)`}],{duration:420,easing:'cubic-bezier(.2,.9,.2,1)'});
  if(r0)openSite(r0);
  history.pushState({full:1},'');}
addEventListener('popstate',()=>{if(full)closePop()});
tiles.forEach((t,i)=>{
  t.addEventListener('pointerenter',e=>{if(e.pointerType!=='mouse')return;t.classList.add('hot');Waves.kick(.3);
    if(full)return;clearTimeout(hideT);clearTimeout(hoverT);hoverT=setTimeout(()=>{if(MODES[i].id!=='inicio')openPop(i)},pop.classList.contains('show')?60:280)});
  t.addEventListener('pointerleave',()=>{t.classList.remove('hot');clearTimeout(hoverT);if(!pinned)hideT=setTimeout(closePop,550)});
  t.addEventListener('focus',()=>t.classList.add('hot'));t.addEventListener('blur',()=>t.classList.remove('hot'));
  t.addEventListener('click',()=>{if(MODES[i].id==='inicio'){closePop();return}
    if(popI===i&&pop.classList.contains('show')&&pinned&&!full){goFull();return}
    if(full){openModeFull(MODES[i].id);return}
    openPop(i,true)});
});
pop.addEventListener('pointerenter',()=>clearTimeout(hideT));
pop.addEventListener('pointerleave',()=>{if(!pinned&&!drag)hideT=setTimeout(closePop,550)});
$('#popX').onclick=()=>{if(full)history.back();else closePop()};
$('#popOpen').onclick=()=>{if(!full)goFull()};
$('#popX').textContent='✕';
addEventListener('keydown',e=>{if(e.key==='Escape'){if(full)history.back();else closePop()}});
// arrastar: puxou pra cima → abre; soltou perto → volta flutuando
const ph=$('#ph');let drag=null;
ph.addEventListener('pointerdown',e=>{if(full||e.target.closest('button'))return;drag={x:e.clientX,y:e.clientY,dx:0,dy:0};pinned=true;ph.setPointerCapture(e.pointerId);pop.classList.add('drag')});
ph.addEventListener('pointermove',e=>{if(!drag)return;drag.dx=e.clientX-drag.x;drag.dy=e.clientY-drag.y;pop.style.transform=`translate(${rest.x+drag.dx}px,${rest.y+drag.dy}px) rotate(${drag.dx*.02}deg)`});
const dEnd=()=>{if(!drag)return;const{dx,dy}=drag;drag=null;pop.classList.remove('drag');
  if(dy<-110||Math.hypot(dx,dy)>220){goFull();return}
  const cur=pop.style.transform;pop.style.transform=`translate(${rest.x}px,${rest.y}px)`;
  if(!RM)pop.animate([{transform:cur},{transform:pop.style.transform}],{duration:520,easing:'cubic-bezier(.34,1.56,.64,1)'})};
ph.addEventListener('pointerup',dEnd);ph.addEventListener('pointercancel',dEnd);
addEventListener('resize',()=>{if(pop.classList.contains('show'))place(targetRect(popI),false);Waves.size()});

/* ---------- rádio: trilha sintetizada original (synthwave 100 BPM) ---------- */
const Radio=(()=>{
  let ctx,master,an,data,on=false,nextT=0,step=0,timer,beatTimes=[];
  const BPM=100,S16=60/BPM/4;
  const prog=[[45,52,57,60],[41,48,53,57],[43,50,55,59],[40,47,52,55]]; // Am F G Em
  const mtof=m=>440*Math.pow(2,(m-69)/12);
  function init(){ctx=new (window.AudioContext||window.webkitAudioContext)();master=ctx.createGain();master.gain.value=.55;
    const comp=ctx.createDynamicsCompressor();an=ctx.createAnalyser();an.fftSize=256;data=new Uint8Array(an.frequencyBinCount);
    master.connect(comp);comp.connect(an);an.connect(ctx.destination)}
  function kick(t){const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(42,t+.16);g.gain.setValueAtTime(1,t);g.gain.exponentialRampToValueAtTime(.001,t+.32);o.connect(g);g.connect(master);o.start(t);o.stop(t+.34);beatTimes.push(t)}
  function snare(t){const b=ctx.createBuffer(1,ctx.sampleRate*.2,ctx.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;const s=ctx.createBufferSource();s.buffer=b;const f=ctx.createBiquadFilter();f.type='highpass';f.frequency.value=1400;const g=ctx.createGain();g.gain.setValueAtTime(.45,t);g.gain.exponentialRampToValueAtTime(.001,t+.18);s.connect(f);f.connect(g);g.connect(master);s.start(t)}
  function hat(t,v){const b=ctx.createBuffer(1,ctx.sampleRate*.05,ctx.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;const s=ctx.createBufferSource();s.buffer=b;const f=ctx.createBiquadFilter();f.type='highpass';f.frequency.value=7000;const g=ctx.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+.04);s.connect(f);f.connect(g);g.connect(master);s.start(t)}
  function tone(t,m,dur,type,vol,cut){const o=ctx.createOscillator(),g=ctx.createGain(),f=ctx.createBiquadFilter();o.type=type;o.frequency.value=mtof(m);f.type='lowpass';f.frequency.setValueAtTime(cut,t);f.frequency.exponentialRampToValueAtTime(cut*.35,t+dur);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(f);f.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.02)}
  function sched(){while(nextT<ctx.currentTime+.15){const bar=Math.floor(step/16)%4,s=step%16,ch=prog[bar];
      if(s%4===0)kick(nextT);if(s===4||s===12)snare(nextT);hat(nextT,s%2?.05:.1);
      if(s%2===0)tone(nextT,ch[0]-12+(s%4===2?12:0),S16*1.8,'sawtooth',.16,900);
      tone(nextT,ch[[0,1,2,3,2,1,0,1][s%8]]+12,S16*.9,'square',.05,2400);
      if(s===0)ch.forEach(n=>tone(nextT,n,S16*15,'triangle',.05,1800));
      nextT+=S16;step++}}
  function level(){if(!on)return 0;an.getByteFrequencyData(data);let s=0;for(let i=1;i<10;i++)s+=data[i];return s/(9*255)}
  function toggle(){if(!ctx)init();on=!on;$('#radio').setAttribute('aria-pressed',on);
    window.__radioOn=on;if(on){ctx.resume();nextT=ctx.currentTime+.05;timer=setInterval(sched,40);$('#rt').textContent='Neon Drift · tocando';toast('Rádio ligada: as ondas agora seguem a batida.')}
    else{clearInterval(timer);$('#rt').textContent='Neon Drift · toque pra ouvir'}
    icon()}
  function icon(){$('#pp').innerHTML=on?'<svg viewBox="0 0 24 24" fill="#fff"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>':'<svg viewBox="0 0 24 24" fill="#fff"><path d="M7 4v16l13-8z"/></svg>'}
  icon();
  function beat(){if(!on)return 0;const t=ctx.currentTime;beatTimes=beatTimes.filter(b=>b>t-.4);let v=0;beatTimes.forEach(b=>{const d=t-b;if(d>=0)v=Math.max(v,Math.exp(-d*9))});return v}
  return{toggle,level,beat,bands(){if(!on)return null;an.getByteFrequencyData(data);return data},get on(){return on}};
})();
$('#radio').onclick=()=>Radio.toggle();

/* ---------- ondas ---------- */
const Waves=(()=>{
  const c=$('#waves'),x=c.getContext('2d');let w,h,d=1,boost=.2;const t0=performance.now();
  function size(){d=Math.min(2,devicePixelRatio||1);w=c.clientWidth;h=c.clientHeight;c.width=w*d;c.height=h*d}
  const eqI=$$('#eq i');
  function draw(now){
    requestAnimationFrame(draw);
    const t=(now-t0)/1000,cs=getComputedStyle(root),A=[cs.getPropertyValue('--a1'),cs.getPropertyValue('--a2'),cs.getPropertyValue('--gold'),'#5ef2ff'];
    const lv=Radio.level(),bt=Radio.beat();boost*=.94;
    root.style.setProperty('--beat',(bt*.9+boost*.3).toFixed(3));
    const bands=Radio.bands();if(bands)eqI.forEach((e,i)=>e.style.height=(3+bands[2+i*6]/255*15)+'px');
    x.setTransform(d,0,0,d,0,0);x.clearRect(0,0,w,h);
    const base=RM?5:7+lv*26+bt*14+boost*18,mid=h*.55;
    for(let L=0;L<4;L++){
      x.beginPath();
      for(let px=0;px<=w;px+=5){const u=px/w;
        const y=mid+Math.sin(u*Math.PI*(2.2+L*.7)+t*(.55+L*.18)*(L%2?-1:1)+L*1.3)*base*(1-L*.16)
               +Math.sin(u*Math.PI*9+t*1.3+L)*base*.18;
        px?x.lineTo(px,y):x.moveTo(px,y)}
      x.strokeStyle=A[L];x.globalAlpha=.16;x.lineWidth=8;x.stroke();x.globalAlpha=.9-L*.12;x.lineWidth=L?1.4:2.2;x.stroke();x.globalAlpha=1}
  }
  size();requestAnimationFrame(draw);
  return{size,kick(k){boost=Math.min(1.5,boost+k)}};
})();

function openWA(msg){if(/X{4}/.test(CFG.wa)){toast('Coloque o número do WhatsApp em CFG.wa pra este botão funcionar.');return}window.open(CFG.wa+'?text='+encodeURIComponent(msg||CFG.waMsg),'_blank','noopener')}
document.addEventListener('click',e=>{if(e.target.closest('[data-full]')){if(!full)goFull();return}const w=e.target.closest('[data-wa]');if(w){const n=w.closest('.it');openWA(n?CFG.waMsg+' Tenho interesse em: '+n.querySelector('b').textContent:null)}});
// carrinho: abre o carrinho do site atual e mostra a contagem dele aqui em cima
$('#cartBtn').onclick=()=>{const cur=popI>=0&&CFG.rota[MODES[popI].id]?MODES[popI].id:'jogos';openModeFull(cur);
  const tryOpen=()=>{try{const d=ifr.contentDocument,n=d&&d.getElementById('cartN'),b=n&&n.closest('button,a,[role=button]');if(b){b.click();return true}}catch(e){}return false};
  if(!tryOpen())ifr.addEventListener('load',()=>setTimeout(tryOpen,300),{once:true})};
setInterval(()=>{try{const d=ifr.contentDocument,n=d&&d.getElementById('cartN');if(!n)return;const v=parseInt(n.textContent)||0,em=$('#cartN');em.textContent=v;em.hidden=!v}catch(e){}},1000);
// link direto: /games/novo/#/gta abre o modo certo
function fromHash(delay){const m=location.hash.match(/^#\/([a-z]+)/);if(!m)return;const id=Object.keys(CFG.rota).find(k=>CFG.rota[k]===m[1]);if(id)setTimeout(()=>openModeFull(id),delay)}
fromHash(700);addEventListener('hashchange',()=>fromHash(0));
let tt;function toast(s){const t=$('#toast');t.textContent=s;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2600)}
})();
